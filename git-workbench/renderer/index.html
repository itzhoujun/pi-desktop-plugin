<!doctype html>
<html lang="zh-CN" data-booting="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v3" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none';"
    />
    <title>Git Workbench</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <header class="topbar">
        <div class="repo-line">
          <span class="branch-chip" id="branchChip" title="当前分支">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M5 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm0 0v9a1.5 1.5 0 1 1-3 0v-9M5 8h3a3 3 0 0 0 3-3V3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <circle cx="12.5" cy="2.5" r="1.3" fill="currentColor" />
            </svg>
            <span id="branchName">—</span>
          </span>
          <span class="repo-name" id="repoName"></span>
          <span class="spacer"></span>
          <button class="icon-btn" id="refreshBtn" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M13 8a5 5 0 1 1-1.6-3.7M13 2v3.2H9.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="sync-line">
          <span class="sync-count" id="syncCount" hidden></span>
          <button class="ghost-btn" id="pullBtn" title="git pull（合并方式）">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M8 2.5v8M8 11l-3-3M8 11l3-3M3.5 13.5h9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            拉取
          </button>
          <button class="ghost-btn" id="pushBtn" title="git push">
            推送
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M8 13V5M8 5l-3 3M8 5l3 3M3.5 2.5h9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <section class="composer">
        <div class="editor">
          <textarea
            id="message"
            rows="3"
            spellcheck="false"
            aria-label="提交信息"
            placeholder="消息"
          ></textarea>
          <button class="gen-btn" id="genBtn" title="用 AI 生成提交信息" aria-label="用 AI 生成提交信息">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M7.2 2.2 8 4.4l2.2.8L8 6l-.8 2.2L6.4 6l-2.2-.8L6.4 4.4 7.2 2.2Zm4.6 6.6.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5.5-1.3ZM4.4 9.6l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6L2.2 12l1.6-.6.6-1.6Z"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
        <div class="commit-row">
          <button class="commit-btn" id="commitBtn">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path
                d="M3 8.6 6.2 12 13 4.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span id="commitLabel">提交</span>
          </button>
          <button class="commit-split" id="commitMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="更多提交选项">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path d="m4.5 6.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="menu" id="commitMenu" role="menu" hidden>
          <button class="menu-item" data-menu="commit-staged" role="menuitem">仅提交已暂存</button>
          <button class="menu-item" data-menu="commit-all" role="menuitem">提交全部更改</button>
          <div class="menu-sep"></div>
          <label class="menu-check"><input type="checkbox" id="optPush" /> 提交后立即推送</label>
          <label class="menu-check"><input type="checkbox" id="optSignoff" /> 添加 Signed-off-by</label>
        </div>
      </section>

      <div class="banner" id="banner" hidden></div>

      <main class="lists" id="lists" aria-live="polite"></main>

      <footer class="statusbar">
        <span class="status-repo" id="statusRepo"></span>
        <span class="status-last" id="statusLast"></span>
      </footer>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header class="sheet-head">
          <button class="icon-btn" id="sheetBack" aria-label="返回">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="sheet-titles">
            <div class="sheet-title" id="sheetTitle"></div>
            <div class="sheet-sub" id="sheetSub"></div>
          </div>
          <button class="icon-btn" id="sheetClose" aria-label="关闭">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico">
              <path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
        </header>
        <div class="sheet-body" id="sheetBody"></div>
        <footer class="sheet-foot" id="sheetFoot" hidden></footer>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>
    <script src="panel.js"></script>
  </body>
</html>
